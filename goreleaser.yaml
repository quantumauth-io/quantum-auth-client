version: 2

project_name: quantum-auth-client

before:
  hooks:
    - go mod tidy

builds:
  - id: quantum-auth-client
    main: ./cmd/quantum-auth-client
    binary: quantumauth
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ldflags:
  - -s -w
    - -X github.com/quantumauth-io/quantum-auth-client/internal/buildinfo.Version={{.Version}}
    - -X github.com/quantumauth-io/quantum-auth-client/internal/buildinfo.Commit={{.ShortCommit}}
    - -X github.com/quantumauth-io/quantum-auth-client/internal/buildinfo.Date={{.Date}}

archives:
  - id: tgz
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README*
  - id: zip
    formats: [ zip ]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README*
      -
nfpms:
  - id: deb
    package_name: quantum-auth-client
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    vendor: "quantumauth-io"
    maintainer: "QuantumAuth <ian.dorion@quantumauth.io>"
    homepage: "https://quantumauth.io"
    license: "Apache-2.0"
    description: "QuantumAuth client"
    formats: [deb]

checksum:
  name_template: "checksums.txt"

changelog:
  use: github

release:
  prerelease: auto
